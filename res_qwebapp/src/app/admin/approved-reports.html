<section class="admin-page approved-page">
  <header class="page-header">
    <h1>Approved Reports</h1>
    <p class="subtitle">These reports were reviewed and approved by admins.</p>
  </header>

  <div class="reports-list">
    <article class="report-card" *ngFor="let report of reports">

      <!-- IMAGE -->
      <div class="report-image">
        <img [src]="report.imageUrl" alt="Approved report image" />
      </div>

      <!-- INFO -->
      <div class="report-info">
        <h2>{{ report.category }}</h2>
        <p><strong>Type:</strong> {{ report.type }}</p>
        <p><strong>Location:</strong> {{ report.location }}</p>
        <p><strong>Approved By:</strong> {{ report.approvedBy }}</p>
        <p><strong>Date/Time:</strong> {{ report.date }} — {{ report.time }}</p>

        <div class="report-actions">
          <button class="btn btn-revert" (click)="revert(report)">
            Revert
          </button>
        </div>
      </div>
    </article>
  </div>
</section>

<style>
  .approved-page {
    padding: 20px;
  }

  .page-header h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    font-family: "Poppins", sans-serif;
    color: #212121;
  }

  .subtitle {
    margin-bottom: 18px;
    font-size: 14px;
    color: #555;
    font-family: "Quicksand", sans-serif;
  }

  .reports-list {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .report-card {
    display: flex;
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    padding: 18px;
    gap: 20px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .report-image img {
    width: 260px;
    height: 180px;
    border-radius: 10px;
    object-fit: cover;
  }

  .report-info {
    flex: 1;
    font-family: "Quicksand", sans-serif;
  }

  .report-info h2 {
    margin: 0 0 10px;
    font-size: 22px;
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    color: #ac1b22; /* RESQ Red */
  }

  .report-info p {
    margin: 3px 0;
    font-size: 14px;
    color: #333;
  }

  .report-actions {
    margin-top: 14px;
  }

  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    font-family: "Poppins", sans-serif;
    cursor: pointer;
    color: white;
    min-width: 130px;
    transition: 0.15s ease;
  }

  .btn-revert {
    background-color: #ac1b22;
  }

  .btn-revert:hover {
    background-color: #8f161c;
    transform: translateY(-2px);
    box-shadow: 0 3px 8px rgba(172, 27, 34, 0.35);
  }

  @media (max-width: 768px) {
    .report-card {
      flex-direction: column;
    }

    .report-image img {
      width: 100%;
    }
  }
</style>
