<section class="admin-page pending-page">
  <header class="page-header">
    <h1>Pending Reports</h1>
    <p class="subtitle">Review and take action on user-submitted reports.</p>
  </header>

  <div class="pending-list">
    <article class="pending-card" *ngFor="let report of reports">
      <!-- IMAGE -->
      <div class="image-wrap">
        <img [src]="report.image" [alt]="report.title" class="report-image" />
      </div>

      <!-- DETAILS -->
      <div class="details">
        <h2 class="report-title">{{ report.title }}</h2>

        <div class="meta-row">
          <div class="meta-group">
            <span class="meta-label">Category:</span>
            <span class="meta-value">{{ report.category }}</span>
          </div>

          <div class="meta-group">
            <span class="meta-label">Reporter:</span>
            <span class="meta-value">{{ report.reporter }}</span>
          </div>
        </div>

        <div class="meta-group">
          <span class="meta-label">Location:</span>
          <span class="meta-value">{{ report.location }}</span>
        </div>

        <div class="meta-row">
          <div class="meta-group">
            <span class="meta-label">Date:</span>
            <span class="meta-value">{{ report.date }}</span>
          </div>

          <div class="meta-group">
            <span class="meta-label">Time:</span>
            <span class="meta-value">{{ report.time }}</span>
          </div>
        </div>

        <p class="description">{{ report.description }}</p>

        <div class="actions">
          <button class="btn btn-approve" (click)="approve(report)">
            Approve
          </button>

          <button class="btn btn-reject" (click)="reject(report)">
            Reject
          </button>
        </div>
      </div>
    </article>
  </div>
</section>

<style>
  .pending-page {
    padding: 20px;
  }

  .page-header h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
    color: #212121;
  }

  .subtitle {
    margin: 0 0 20px;
    font-size: 14px;
    font-family: 'Quicksand', sans-serif;
    color: #6b7280;
  }

  .pending-list {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .pending-card {
    display: flex;
    gap: 22px;
    background: #ffffff;
    border-radius: 14px;
    padding: 20px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  }

  /* IMAGE */
  .image-wrap {
    flex: 0 0 280px;
  }

  .report-image {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
  }

  /* DETAILS */
  .details {
    flex: 1;
    font-family: 'Quicksand', sans-serif;
  }

  .report-title {
    margin: 0 0 10px;
    font-size: 22px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
  }

  .meta-row {
    display: flex;
    gap: 20px;
    margin-bottom: 6px;
  }

  .meta-group {
    display: flex;
    gap: 4px;
    font-size: 14px;
  }

  .meta-label {
    font-weight: 600;
    color: #444;
  }

  .meta-value {
    color: #111;
  }

  .description {
    margin: 12px 0;
    font-size: 14px;
    color: #374151;
    line-height: 1.45;
  }

  /* BUTTONS — Yellow & Red Theme */
  .actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    color: white;
  }

  .btn-approve {
    background-color: #ffc806; /* Yellow */
    color: #212121;
  }

  .btn-approve:hover {
    background-color: #e5b400;
  }

  .btn-reject {
    background-color: #ac1b22; /* RESQ Red */
  }

  .btn-reject:hover {
    background-color: #8f161c;
  }

  @media (max-width: 900px) {
    .pending-card {
      flex-direction: column;
    }

    .image-wrap {
      width: 100%;
    }
  }
</style>
