<section class="admin-page settings-page">
  <header class="page-header">
    <h1>Settings</h1>
  </header>

  <div class="settings-card">
    <h2>Notification Preferences</h2>

    <div class="setting-row">
      <label>
        <input type="checkbox" [(ngModel)]="notifyEmail" />
        Email notifications for new reports
      </label>
    </div>

    <div class="setting-row">
      <label>
        <input type="checkbox" [(ngModel)]="notifySMS" />
        SMS notifications for urgent incidents
      </label>
    </div>

    <button class="btn btn-save" (click)="save()">Save Settings</button>
  </div>
</section>
